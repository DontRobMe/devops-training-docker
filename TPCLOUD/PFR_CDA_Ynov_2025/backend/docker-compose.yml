
services:
  db:
    image: postgres:17.4
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  api:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_USER: user
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: mydb
      DATABASE_URL: file:./database.sqlite
      PORT: ${BACKEND_PORT:-8080}
      ACCESS_TOKEN_SECRET: dDBhEp0gaqrF0S8rvQZBipv8fh9YlElQxTJriHj55zIS0iD4q6
      REFRESH_TOKEN_SECRET: UcZITM81QsyL5HVGeY48AxbscvwnQIO65wflWeTrREKIVEWu4L
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - backend
    command: sh -c "npm run start"

networks:
  backend:

volumes:
  pgdata:
